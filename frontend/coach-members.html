<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Chat - Coach Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/dashboard.css">
    <link rel="stylesheet" href="/chat.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <span class="logo-icon">💪</span>
                <span class="logo-text">FitTrack AI</span>
                <span class="coach-badge">Coach</span>
            </div>
            <div class="navbar-menu">
                <a href="/coach/dashboard" class="nav-link">
                    <span class="nav-icon">🏠</span>
                    <span>Dashboard</span>
                </a>
                <a href="/coach/alerts" class="nav-link">
                    <span class="nav-icon">📢</span>
                    <span>Alerts</span>
                </a>
                <a href="/coach/members" class="nav-link active">
                    <span class="nav-icon">💬</span>
                    <span>Messages</span>
                </a>
            </div>
            <div class="navbar-actions">
                <button class="profile-btn" id="profileBtn">
                    <span class="profile-avatar" id="userAvatar">C</span>
                    <span class="profile-name" id="userName">Coach</span>
                    <span class="dropdown-icon">▼</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="profile-sidebar" id="profileSidebar">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3>My Profile</h3>
                <button class="close-btn" id="closeSidebar">✕</button>
            </div>
            <div class="sidebar-body">
                <div class="user-info-section">
                    <div class="user-avatar-large" id="userAvatarLarge">C</div>
                    <h4 class="user-name-large" id="userNameLarge">Coach Name</h4>
                    <p class="user-email" id="userEmail">coach@example.com</p>
                    <span class="user-badge"
                        style="background: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.3); color: #f472b6;">Coach</span>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>

    <main class="chat-main">
        <div class="chat-container">
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3>👥 Members</h3>
                </div>
                <div class="chat-members-list" id="membersList">
                    <div class="empty-state">
                        <span class="empty-icon">👥</span>
                        <p>No members</p>
                    </div>
                </div>
            </div>

            <div class="chat-window" id="chatWindow">
                <div class="chat-empty-state">
                    <span class="empty-icon">💬</span>
                    <h3>Select a member to start chatting</h3>
                    <p>Choose a member from the list to view conversation</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Logout Confirmation Modal -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-content">
            <div class="modal-icon">🚪</div>
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to logout?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelLogout">Cancel</button>
                <button class="btn btn-danger" id="confirmLogout">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/coach-members.js"></script>
</body>

</html>
