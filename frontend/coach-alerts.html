<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Alerts - Coach Dashboard</title>
    <meta name="description" content="Send alerts to all gym members">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/dashboard.css">
    <style>
        .alert-form-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .alert-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .send-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert-history {
            margin-top: 3rem;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .history-message {
            color: var(--text-primary);
            line-height: 1.6;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <span class="logo-icon">💪</span>
                <span class="logo-text">FitTrack AI</span>
                <span class="coach-badge">Coach</span>
            </div>
            <div class="navbar-menu">
                <a href="/coach/dashboard" class="nav-link">
                    <span class="nav-icon">🏠</span>
                    <span>Dashboard</span>
                </a>
                <a href="/coach/alerts" class="nav-link active">
                    <span class="nav-icon">📢</span>
                    <span>Alerts</span>
                </a>
                <a href="/coach/members" class="nav-link">
                    <span class="nav-icon">💬</span>
                    <span>Messages</span>
                </a>
            </div>
            <div class="navbar-actions">
                <button class="profile-btn" id="profileBtn">
                    <span class="profile-avatar" id="userAvatar">C</span>
                    <span class="profile-name" id="userName">Coach</span>
                    <span class="dropdown-icon">▼</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Profile Sidebar -->
    <div class="profile-sidebar" id="profileSidebar">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3>My Profile</h3>
                <button class="close-btn" id="closeSidebar">✕</button>
            </div>
            <div class="sidebar-body">
                <div class="user-info-section">
                    <div class="user-avatar-large" id="userAvatarLarge">C</div>
                    <h4 class="user-name-large" id="userNameLarge">Coach Name</h4>
                    <p class="user-email" id="userEmail">coach@example.com</p>
                    <span class="user-badge"
                        style="background: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.3); color: #f472b6;">Coach</span>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="dashboard-main">
        <div class="container">
            <div class="alert-form-container">
                <h1 style="margin-bottom: 0.5rem;">Send Alert to All Members 📢</h1>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Broadcast important messages to all gym
                    members</p>

                <div id="successMessage" class="success-message"></div>

                <div class="alert-form">
                    <div class="form-group">
                        <label class="form-label" for="alertMessage">Alert Message</label>
                        <textarea id="alertMessage" class="form-textarea" placeholder="Type your alert message here..."
                            maxlength="500"></textarea>
                        <div
                            style="text-align: right; margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">
                            <span id="charCount">0</span>/500 characters
                        </div>
                    </div>
                    <button class="send-btn" id="sendAlertBtn">
                        <span id="btnText">📢 Send Alert to All Members</span>
                        <span id="btnLoading" style="display: none;">Sending...</span>
                    </button>
                </div>

                <div class="alert-history">
                    <h2>Recent Alerts</h2>
                    <div id="alertHistory">
                        <div class="empty-state">
                            <span class="empty-icon">📢</span>
                            <p>No alerts sent yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Logout Confirmation Modal -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-content">
            <div class="modal-icon">🚪</div>
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to logout?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelLogout">Cancel</button>
                <button class="btn btn-danger" id="confirmLogout">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/coach-alerts.js"></script>
</body>

</html>
